services:
  - type: web
    name: market-memory-pro
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.lock
    startCommand: bash scripts/start-production.sh
    healthCheckPath: /health/ready
    # Native extension is compiled by the requirements.lock editable install.
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        sync: false
      - key: PGSSLROOTCERT
        sync: false
      - key: MARKET_MEMORY_ORIGIN
        sync: false
      - key: MARKET_MEMORY_SECURE_COOKIE
        value: '1'
      - key: MARKET_MEMORY_REQUIRE_NATIVE_QUANT
        value: '1'
      - key: MARKET_MEMORY_PRODUCTION
        value: '1'
