services:
  - type: web
    name: market-memory-pro
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.lock
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        sync: false
      - key: PGSSLROOTCERT
        sync: false
      - key: MARKET_MEMORY_ORIGIN
        sync: false
      - key: MARKET_MEMORY_SECURE_COOKIE
        value: '1'
