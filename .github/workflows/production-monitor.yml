name: Production read-only smoke monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-monitor.yml'
      - 'scripts/verify-production.py'
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deployed health, native engine, paper mode, public assets and private API
        env:
          MARKET_MEMORY_URL: https://market-memory-pro.onrender.com
        run: python scripts/verify-production.py
