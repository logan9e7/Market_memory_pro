name: Production read-only smoke monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deployed health, native engine, paper mode, public assets and private API
        env:
          MARKET_MEMORY_URL: https://market-memory-pro.onrender.com
          EXPECTED_REVISION: ${{ github.event_name == 'push' && github.sha || '' }}
          WAIT_FOR_REVISION_SECONDS: ${{ github.event_name == 'push' && '480' || '0' }}
        run: python scripts/verify-production.py
