name: Hybrid quant checks
on:
  push:
    paths:
      - 'native/**'
      - 'app/quant_hybrid_v2.py'
      - '.github/workflows/hybrid-quant.yml'
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native math
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra native/tests/quant_math_test.cpp -o /tmp/quant_math_test
          /tmp/quant_math_test
      - name: Build native extension
        run: |
          python -m pip install pybind11
          cmake -S native -B native/build-v2 -DCMAKE_PROJECT_INCLUDE= -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" -C /dev/null
          c++ -O2 -shared -std=c++17 -fPIC $(python -m pybind11 --includes) native/quant_core_v2.cpp -o "app/_quant_core_v2$(python3-config --extension-suffix)"
      - name: Check native module
        run: |
          python -c "from app import _quant_core_v2 as q; assert q.black_scholes(100,100,1,0.05,0.2,True)['theoretical_price'] > 10"
          python -c "from app.quant_hybrid_v2 import engine_name; assert engine_name() == 'cpp'"
