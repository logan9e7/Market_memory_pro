name: Hybrid quant checks
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.lock pybind11
      - name: Compile and run standalone C++ tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic native/tests/quant_math_test.cpp -o /tmp/quant-test
          /tmp/quant-test
      - name: Build pybind11 native module
        run: |
          cmake -S native -B native/build -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build native/build --config Release
          cp native/build/_quant_core*.so app/
      - name: Verify native selected and test parity
        run: |
          python -c "from app.quant_hybrid import engine_name; assert engine_name() == 'cpp-pybind11'"
          python -m unittest discover -s tests -p 'test_quant_hybrid.py' -v
          python -m unittest discover -s tests -p 'test_backend_contracts.py' -v
