name: Application checks
on: [push, pull_request]
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock
      - name: Verify native C++ installed via production requirements
        run: |
          python -c "from app.quant_hybrid import engine_name; assert engine_name() == 'cpp-pybind11', engine_name()"
          python -c "from app import _quant_core; assert abs(_quant_core.black_scholes_price(100,100,1,0.05,0.2,True)-10.450583572185565) < 1e-9"
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - name: Install age for encrypted backup and restore drill
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Validate shell scripts
        run: bash -n scripts/backup-production.sh scripts/test-postgres.sh scripts/start-production.sh
      - name: PostgreSQL workflow with verified TLS
        env:
          MM_TEST_PYTHON: python
        run: bash scripts/test-postgres.sh

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - name: Install isolated browser test dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test actual Research Desk UI in Chromium
        run: python tests/browser_smoke.py
      - name: Save synthetic UI screenshot if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-desk-browser-smoke
          path: |
            browser-smoke.png
            discovery-qa-*.png
            app-qa-*.png
          if-no-files-found: ignore
          retention-days: 3
